name: Build RAM

on:
  push:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore NuGet Packages via MSBuild
      run: msbuild "RBX Alt Manager.sln" /t:Restore /p:Configuration=Release /p:Platform="x86"

    - name: Build Solution
      run: msbuild "RBX Alt Manager.sln" /p:Configuration=Release /p:Platform="x86"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RBX-Alt-Manager-Modified
        path: '**/bin/x86/Release/'
