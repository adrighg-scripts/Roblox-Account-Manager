name: Build RAM

on:
  push:
    branches: [ "master", "main" ]

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup NuGet
      uses: nuget/setup-nuget@v3

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Fix Project Paths for CI
      shell: powershell
      run: |
        $csprojPath = "RBX Alt Manager/RBX Alt Manager.csproj"
        $content = Get-Content -Path $csprojPath -Raw
        # Ersetzt die harten relativen Pfade im Projekt durch den absoluten Workspace-Pfad
        $newContent = $content -replace '\.\.\\packages\\', '$('${{ github.workspace }}\packages\')'
        Set-Content -Path $csprojPath -Value $newContent -Encoding UTF8

    - name: Restore Packages
      run: nuget restore "RBX Alt Manager.sln" -PackagesDirectory "packages"

    - name: Build Solution
      run: msbuild "RBX Alt Manager.sln" /p:Configuration=Release /p:Platform="x86" /p:RestorePackages=false

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RBX-Alt-Manager-Modified
        path: |
          **/bin/x86/Release/
          **/bin/Release/
